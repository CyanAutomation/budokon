name: Kaseki DRY Sweep

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

run-name: >-
  DRY sweep · ${{ github.repository }}@main

permissions:
  contents: read

# Protect the complete external Kaseki run from overlapping sweeps.
concurrency:
  group: kaseki-dry-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dry_sweep:
    name: Run Kaseki DRY sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Kaseki allows a run to last three hours; leave time for
    # preflight and final status polling.
    timeout-minutes: 200

    # Restrict `kaseki-agent` to `main` in repository environment settings.
    # Configure KASEKI_API_TOKEN as a secret and KASEKI_BASE_URL as an environment variable.
    environment: kaseki-agent

    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      KASEKI_API_BASE_URL: ${{ vars.KASEKI_BASE_URL }}/api/v1

      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main

      TASK_DESCRIPTION: >-
        Perform a conservative DRY-principle review of this repository.

      # Adjust these paths for each repository.
      ALLOWLIST: src/**/*,scripts/**/*,test/**/*,tests/**/*

      VALIDATION_COMMAND: node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 10) process.exit(1)' && npm run check

    steps:
      - name: Check out trusted main-branch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail

          command -v curl >/dev/null
          command -v jq >/dev/null
          command -v uuidgen >/dev/null

      - name: Validate Kaseki configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?Configure KASEKI_BASE_URL as an environment variable}"

          if [[ "$KASEKI_BASE_URL" != "https://kaseki-tunnel.scheimann.xyz" ]]; then
            echo "::error title=Invalid Kaseki URL::Use the approved HTTPS controller origin."
            exit 1
          fi

      - name: Verify controller health
        uses: CyanAutomation/kaseki-agent/.github/actions/verify-controller-health@30db5d15e117b8d8de13eb66766d48cf6b7d618b
        with:
          base-url: ${{ vars.KASEKI_BASE_URL }}

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"

          jq -e '.status == "ready"' "$response_file" >/dev/null

          echo "Kaseki readiness check succeeded."

      - name: Verify gateway connectivity and authentication
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?Configure KASEKI_API_TOKEN as an environment secret}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_API_BASE_URL/gateway-test?stage=1"

          jq -e '.status == "ok"' "$response_file" >/dev/null

          echo "Kaseki gateway authentication succeeded."

      - name: Verify Kaseki API capabilities
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?Configure KASEKI_API_TOKEN as an environment secret}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_API_BASE_URL/capabilities"

          if ! jq -e '(.taskModes | index("patch")) != null and (.publishModes | index("pr")) != null' \
            "$response_file" >/dev/null; then
            echo "::error title=Unsupported Kaseki API capabilities::The controller must support patch tasks and regular pull requests."
            exit 1
          fi

      - name: Verify Kaseki runner preflight
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?Configure KASEKI_API_TOKEN as an environment secret}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 \
              --connect-timeout 10 --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_API_BASE_URL/preflight"
          )"

          if [[ "$http_status" != "200" ]] || \
            ! jq -e '(.status == "ok" or .status == "degraded") and ((.failedChecks // []) | length == 0) and ((.errors // []) | length == 0)' \
              "$response_file" >/dev/null 2>&1; then
            echo "::error title=Kaseki runner preflight failed::The runner did not pass preflight; submission was skipped."
            exit 1
          fi

          echo "Kaseki runner preflight passed."

      - name: Submit DRY sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          idempotency_key="$(
            tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid
          )"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,
                idempotencyKey: $idempotencyKey,

                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),

                validationCommands: [$validationCommand],

                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },

                taskPrompt: (
                  $taskDescription

                  + "\n\nLook for duplicated knowledge rather than merely duplicated text. "
                  + "Strong candidates include repeated business rules, validation rules, "
                  + "constants, configuration knowledge, parsing or normalisation logic, "
                  + "transformations, and substantially identical implementations that "
                  + "must remain synchronised. "

                  + "\n\nDo not assume that all repetition violates DRY. Similar-looking "
                  + "code may represent separate concepts or may need to evolve independently. "
                  + "Prefer clear duplication over an abstraction that increases coupling, "
                  + "indirection, or cognitive load. "

                  + "\n\nIdentify the single strongest DRY improvement available. Only act "
                  + "when the duplication represents the same underlying knowledge and "
                  + "consolidation has a clear maintenance benefit. "

                  + "\n\nPrefer reusing an existing abstraction. If a new abstraction is "
                  + "justified, keep it at the narrowest sensible scope. "

                  + "\n\nMake at most one focused refactoring. "

                  + "\n\nA no-change result is successful. If there is no sufficiently "
                  + "valuable, high-confidence DRY improvement, make no changes."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --retry 3 \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_API_BASE_URL/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              echo
              echo "The controller response body is intentionally omitted from logs and summaries."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          run_id="$(jq -er '.id | strings | select(test("^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"))' "$response_file")"

          output_delimiter="$(uuidgen)"

          {
            echo "run_id<<$output_delimiter"
            echo "$run_id"
            echo "$output_delimiter"
          } >> "$GITHUB_OUTPUT"

          echo "idempotency_key=$idempotency_key" >> "$GITHUB_OUTPUT"

          echo "Kaseki DRY sweep submitted."

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: node scripts/wait-for-kaseki.ts

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki DRY sweep"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Maximum refactorings | \`1\` |"
            echo "| Kaseki run | \`$RUN_ID\` |"
            echo "| Final status | \`$FINAL_STATUS\` |"
          } >> "$GITHUB_STEP_SUMMARY"
