name: Release dataset
on:
  push:
    tags:
      - 'dataset-v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:typescript-only
      - name: Validate canonical data
        run: npm run validate
      - name: Associate dataset version, tag, and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run verify-release
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Compile release artifacts
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Verify release artifact consistency
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}
        run: npm run check-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/judoka.json
            dist/techniques.json
            dist/manifest.json
