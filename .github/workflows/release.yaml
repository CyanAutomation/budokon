name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run (preview only, no tags/releases created)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # A manual dispatch may select any ref; releases are only produced from main.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Full history for release planning

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build

      - name: Publish smoke test
        run: npm run test

      - name: Fallow - Codebase Intelligence
        uses: fallow-rs/fallow@cd69f3aa524e1b1efb6cb1a7fb22db5e12aed456 # v2.95.0
        with:
          version: "2.95.0"
          command: health
          score: true
          fail-on-issues: false
          hotspots: true
          targets: true
          save-snapshot: true

      - name: Plan or publish release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm run release:dry 2>&1 | tee release-output.log
          else
            npm run release 2>&1 | tee release-output.log
          fi

      - name: Upload release log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-output
          path: release-output.log
          retention-days: 7
