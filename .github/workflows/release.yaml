name: Release

on:
  # push:
  #   branches:
  #     - main
    # Only trigger for commits that semantic-release will act on
    # (feat:, fix:, breaking changes, or release commits)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run (preview only, no tags/releases created)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Full history for semantic-release

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build

      - name: Publish smoke test
        run: npm run test

      - name: Fallow - Codebase Intelligence
        uses: fallow-rs/fallow@cd69f3aa524e1b1efb6cb1a7fb22db5e12aed456 # v2.95.0
        with:
          version: "2.95.0"
          command: health
          score: true
          fail-on-issues: false
          hotspots: true
          targets: true
          save-snapshot: true

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm run release:dry 2>&1 | tee release-output.log
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            npm run release 2>&1 | tee release-output.log
            # Check if release was created (look for "published" in output)
            if grep -q "Published release" release-output.log; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              # Extract version from git describe
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "released=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-output
          path: release-output.log
          retention-days: 30
