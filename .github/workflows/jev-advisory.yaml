name: JEV Search Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-evaluation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate-search:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: jev-assessment
    env:
      JEV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JEV_MODEL: ${{ vars.JEV_MODEL }}
      JEV_TIMEOUT_MS: "20000"
      JEV_MINIMUM_RELEVANCE: "0.5"

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate semantic search
        run: npm run jev:evaluate
