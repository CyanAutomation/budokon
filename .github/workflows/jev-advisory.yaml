name: JEV Advisory Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-evaluation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate-search:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: jev-assessment
    env:
      JEV_MODEL: ${{ vars.JEV_MODEL }}
      JEV_TIMEOUT_MS: "20000"
      JEV_MINIMUM_RELEVANCE: "0.5"
      JEV_PLAYSTYLE_THRESHOLD: "0.78"

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate semantic search
        run: npm run jev:evaluate
        env:
          JEV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Evaluate playstyle classification
        run: npm run jev:evaluate:playstyle
        env:
          JEV_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
