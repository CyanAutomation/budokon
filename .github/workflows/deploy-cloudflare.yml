name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate canonical data
        run: npm run validate

      - name: Build deployment dataset
        run: npm run build:data
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}

      - name: Run tests
        run: npm run test

      - name: Check deployment target validator syntax
        run: node --check scripts/validate-cloudflare-deployment-target.mjs

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate and identify deployed public target
        run: node scripts/validate-cloudflare-deployment-target.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}

      - name: Smoke-test deployed public API
        run: |
          for attempt in 1 2 3; do
            node scripts/smoke-deployment.mjs && exit 0
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
