name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch may select any ref. Production secrets must only be
    # available when the workflow is running from the protected default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Restrict the production environment to the default branch in repository settings.
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate canonical data
        run: npm run validate

      - name: Build deployment dataset
        run: npm run build:data
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}

      - name: Verify deployment artifact consistency
        run: npm run check-artifacts
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}

      - name: Run tests
        run: npm run test

      - name: Compile runtime TypeScript
        run: npm run build:runtime

      - name: Type-check tooling and tests
        run: npm run typecheck:tools

      - name: Enforce TypeScript-only source files
        run: npm run check:typescript-only

      - name: Check deployment workflow executable paths
        run: npm run check:deployment-workflow

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate and identify deployed public target
        run: npm run validate:deployment-target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}

      - name: Smoke-test deployed public API
        run: |
          for attempt in 1 2 3; do
            npm run smoke:deployment && exit 0
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
