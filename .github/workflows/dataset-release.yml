name: Release dataset
on:
  push:
    tags:
      - 'dataset-v*'
permissions:
  contents: read

concurrency:
  group: dataset-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile runtime TypeScript
        run: npm run build:runtime
      - name: Type-check tooling and tests
        run: npm run typecheck:tools
      - run: npm run check:typescript-only
      - name: Validate canonical data
        run: npm run validate
      - name: Associate dataset version, tag, and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run verify-release
          release_commit="$(git rev-parse --verify "$RELEASE_TAG^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" "origin/${{ github.event.repository.default_branch }}"
      - name: Compile release artifacts
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Verify release artifact consistency
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}
        run: npm run check-artifacts
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-release-artifacts
          path: dist/*.json
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dataset-release-artifacts
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.json
