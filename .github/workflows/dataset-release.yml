name: Release dataset
on:
  push:
    tags:
      - 'dataset-v*'
permissions:
  contents: write

concurrency:
  group: dataset-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile runtime TypeScript
        run: npm run build:runtime
      - name: Type-check tooling and tests
        run: npm run typecheck:tools
      - run: npm run check:typescript-only
      - name: Validate canonical data
        run: npm run validate
      - name: Associate dataset version, tag, and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run verify-release
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Compile release artifacts
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Verify release artifact consistency
        env:
          SOURCE_GIT_COMMIT: ${{ github.sha }}
        run: npm run check-artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.json
