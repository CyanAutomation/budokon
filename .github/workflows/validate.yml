name: Validate canonical data

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check README links and Markdown
        run: npm run check:docs
      - name: Compile runtime TypeScript
        run: npm run build:runtime
      - name: Type-check tooling and tests
        run: npm run typecheck:tools
      - run: npm run check:typescript-only
      - name: Check deployment workflow executable paths
        run: npm run check:deployment-workflow
      - name: Test with TypeScript coverage
        run: npm run test:coverage
      - name: Run Fallow TypeScript health report
        run: npm run fallow:health
      - run: npm run validate
      - name: Compile expected output and verify tracked artifacts
        run: SOURCE_GIT_COMMIT=$(node -p "require('./dist/manifest.json').sourceGitCommit") npm run check-artifacts

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
      - name: Install actionlint
        run: 'go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12'
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*'
      - name: Scan workflows for security issues
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"
