name: Validate canonical data
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --cache .npm
      - run: npm test
      - run: npm run validate
      - name: Verify deterministic generated artifacts
        run: |
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/first-build.sha256
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/second-build.sha256
          diff -u /tmp/first-build.sha256 /tmp/second-build.sha256
