name: Validate canonical data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile runtime TypeScript
        run: npm run build:runtime
      - name: Type-check tooling and tests
        run: npm run typecheck:tools
      - run: npm run check:typescript-only
      - name: Check deployment workflow executable paths
        run: npm run check:deployment-workflow
      - run: npm test
      - run: npm run validate
      - name: Compile expected output and verify tracked artifacts
        run: SOURCE_GIT_COMMIT=$(node -p "require('./dist/manifest.json').sourceGitCommit") npm run check-artifacts

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.0"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
      - name: Lint workflows
        run: "$(go env GOPATH)/bin/actionlint .github/workflows/*"
