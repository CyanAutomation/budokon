name = "budokon"
main = "worker/index.ts"
compatibility_date = "2026-08-25"

preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/docs", "/docs/", "/openapi/*"]

# Emit Worker request, error, and invocation data to Cloudflare Observability.
# Configure alerts from these signals as documented in docs/OPERATIONS.md.
[observability]
enabled = true

[vars]
# The catalogue contains no private records by default, so any browser game may
# read it. Replace * with a comma-separated origin allowlist to restrict this.
PUBLIC_ALLOWED_ORIGINS = "*"

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "870281"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "870284"

  [ratelimits.simple]
  limit = 30
  period = 60

# API_KEY, MCP_ALLOWED_HOSTNAMES and (optionally) INTERNAL_API_KEY are Worker secrets. Configure them
# with `wrangler secret put`; never add their values to this file.
