openapi: 3.1.0
info:
  title: BU-DO-KON public catalogue API
  version: 1.0.0
  description: >-
    Public, read-only REST interface for the BU-DO-KON judo catalogue. This
    contract excludes controls for internal-only hidden records. The public
    coverage operation is GET /v1/coverage/public; the legacy coverage response
    is deprecated and scheduled to sunset on 2027-01-15.
  contact:
    url: https://github.com/CyanAutomation/budokon
  license:
    name: GPL-3.0-or-later
    url: https://github.com/CyanAutomation/budokon/blob/main/LICENSE
security: []
servers:
  - url: https://budokon.scheimann.workers.dev
paths:
  /v1/judoka:
    get:
      operationId: listJudoka
      summary: Search, filter, or page public judoka
      description: >-
        `q` matches normalized names, slugs, legacy slugs, and aliases. Repeated
        and comma-separated values are both accepted for filters and exclude.
        Values in one filter are ORed; different filters are ANDed. Supplying
        `limit` changes the legacy array response to a named page response.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/Gender'
        - $ref: '#/components/parameters/WeightClass'
        - $ref: '#/components/parameters/Rarity'
        - $ref: '#/components/parameters/PersonType'
        - $ref: '#/components/parameters/SignatureMoveIds'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/JudokaList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/judoka/{id}:
    get:
      operationId: getJudoka
      summary: Look up a public judoka by ID or alias
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Judoka' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/techniques:
    get:
      operationId: listTechniques
      summary: Search, filter, or page techniques
      description: Category and subcategory filters accept repeated or comma-separated exact normalized values (case- and diacritic-insensitive).
      parameters:
        - $ref: '#/components/parameters/TechniqueQuery'
        - $ref: '#/components/parameters/TechniqueCategory'
        - $ref: '#/components/parameters/TechniqueSubCategory'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/TechniqueList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/techniques/{id}:
    get:
      operationId: getTechnique
      summary: Get a technique by ID
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Technique' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/events:
    get:
      operationId: listEvents
      summary: List ruleset-scoped gameplay events
      parameters:
        - $ref: '#/components/parameters/Ruleset'
        - $ref: '#/components/parameters/EventCategory'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/EventList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/events/{id}:
    get:
      operationId: getEvent
      summary: Get a gameplay event by ID
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/Event' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/events/draw:
    post:
      operationId: drawEvent
      summary: Draw a random or deterministic gameplay event
      description: A ruleset is required. Provide a seed and retain the returned dataset version and algorithm for reproducibility.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruleset]
              additionalProperties: false
              properties:
                ruleset: { type: string, minLength: 1, example: ju-do-kon-v1 }
                category: { type: string, example: shiai }
                seed: { type: string }
                exclude: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/EventDraw' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/countries:
    get:
      operationId: listCountries
      summary: List supported countries
      responses:
        '200': { $ref: '#/components/responses/Countries' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/weight-categories:
    get:
      operationId: listWeightCategories
      summary: List supported weight categories
      responses:
        '200': { $ref: '#/components/responses/WeightCategories' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/version:
    get:
      operationId: getVersion
      summary: Get catalogue and draw-algorithm versions
      responses:
        '200': { $ref: '#/components/responses/Version' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/status:
    get:
      operationId: getStatus
      summary: Get liveness status and immutable release identity
      description: This reports that the Worker and bundled catalogue are responding; it does not check external dependencies.
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/coverage:
    get:
      operationId: getLegacyCoverage
      summary: Get legacy coverage metadata (deprecated)
      deprecated: true
      description: >-
        This response includes all-record total and hidden-record counts. Migrate
        to GET /v1/coverage/public, which contains public real-judoka metrics only.
        This legacy operation sunsets on 2027-01-15.
      responses:
        '200': { $ref: '#/components/responses/LegacyCoverage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/coverage/public:
    get:
      operationId: getPublicCoverage
      summary: Get public real-judoka coverage metrics
      description: Contains no all-record or hidden-record counts.
      responses:
        '200': { $ref: '#/components/responses/PublicCoverage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/draw:
    post:
      operationId: drawJudoka
      summary: Draw one or more public judoka
      description: A seed and returned dataset version/algorithm make the result reproducible. Hidden-record controls are internal-only and intentionally absent from this public contract.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                count: { type: integer, minimum: 1, description: Must not exceed the eligible pool size. }
                seed: { type: string }
                algorithm: { type: string, enum: [budokon-v1], example: budokon-v1 }
                filters: { $ref: '#/components/schemas/Filters' }
                exclude: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/JudokaDraw' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    Id: { name: id, in: path, required: true, description: "UUID, slug, legacy slug, or supported alias", schema: { type: string, minLength: 1 } }
    Q: { name: q, in: query, description: "Normalized substring search over name, slug, legacy slug, and aliases. Empty means no text filter.", schema: { type: string } }
    TechniqueQuery: { name: q, in: query, description: "Normalized substring search over technique ID, name, Japanese name, and description.", schema: { type: string } }
    CountryCode: { name: countryCode, in: query, description: "Repeated or comma-separated values are ORed.", schema: { type: string, example: JP } }
    Gender: { name: gender, in: query, description: "Repeated or comma-separated values are ORed.", schema: { type: string, enum: [male, female], example: female } }
    WeightClass: { name: weightClass, in: query, description: "Repeated or comma-separated values are ORed.", schema: { type: string, example: '-81' } }
    Rarity: { name: rarity, in: query, description: "Repeated or comma-separated values are ORed.", schema: { type: string, enum: [Common, Rare, Epic, Legendary], example: Legendary } }
    PersonType: { name: personType, in: query, description: "Repeated or comma-separated values are ORed.", schema: { type: string, enum: [real, fictional], example: real } }
    SignatureMoveIds: { name: signatureMoveIds, in: query, description: "Repeated or comma-separated values match any signature move.", schema: { type: string, example: seoi-nage } }
    Exclude: { name: exclude, in: query, description: "IDs or slugs to exclude; repeated and comma-separated values are accepted.", schema: { type: string } }
    Limit: { name: limit, in: query, description: Enables cursor pagination., schema: { type: integer, minimum: 1, maximum: 100 } }
    Cursor: { name: cursor, in: query, description: "ID returned as nextCursor; requires limit and the same filters.", schema: { type: string, minLength: 1 } }
    Ruleset: { name: ruleset, in: query, schema: { type: string, example: ju-do-kon-v1 } }
    EventCategory: { name: category, in: query, schema: { type: string, example: shiai } }
    TechniqueCategory: { name: category, in: query, description: "Exact normalized (case- and diacritic-insensitive) category filter; repeated and comma-separated values are ORed.", schema: { type: string, enum: [Nage-waza, Katame-waza], example: Nage-waza } }
    TechniqueSubCategory: { name: subCategory, in: query, description: "Exact normalized (case- and diacritic-insensitive) subcategory filter; repeated and comma-separated values are ORed.", schema: { type: string, enum: [Te-waza, Koshi-waza, Ashi-waza, Ma-sutemi-waza, Yoko-sutemi-waza, Osaekomi-waza, Shime-waza, Kansetsu-waza], example: Te-waza } }
  schemas:
    Filters:
      type: object
      additionalProperties: false
      description: Values in one filter are ORed; different filter fields are ANDed.
      properties:
        countryCode: { oneOf: [ { type: string }, { type: array, minItems: 1, items: { type: string } } ] }
        gender: { oneOf: [ { type: string }, { type: array, minItems: 1, items: { type: string } } ] }
        weightClass: { oneOf: [ { type: string }, { type: array, minItems: 1, items: { type: string } } ] }
        rarity: { oneOf: [ { type: string }, { type: array, minItems: 1, items: { type: string } } ] }
        personType: { oneOf: [ { type: string }, { type: array, minItems: 1, items: { type: string } } ] }
        signatureMoveIds: { oneOf: [ { type: string }, { type: array, minItems: 1, items: { type: string } } ] }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
    Judoka:
      type: object
      required: [id, slug, firstname, surname, personType, countryCode, weightClass, category, stats, signatureMoveIds, lastUpdated, profileUrl, bio, gender, isHidden, rarity]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        firstname: { type: string }
        surname: { type: string }
        aliases: { type: array, items: { type: string } }
        legacySlugs: { type: array, items: { type: string } }
        personType: { type: string, enum: [real, fictional] }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        country: { type: string, description: Resolved country display name when available. }
        weightClass: { type: string, pattern: '^[+-][0-9]{2,3}$' }
        category: { const: Judo }
        stats:
          type: object
          required: [power, speed, technique, kumikata, newaza]
          additionalProperties: false
          properties:
            power: { type: integer, minimum: 0, maximum: 10 }
            speed: { type: integer, minimum: 0, maximum: 10 }
            technique: { type: integer, minimum: 0, maximum: 10 }
            kumikata: { type: integer, minimum: 0, maximum: 10 }
            newaza: { type: integer, minimum: 0, maximum: 10 }
        signatureMoveIds: { type: array, minItems: 1, items: { type: string } }
        playstyle:
          type: object
          description: Optional human-approved editorial playstyle metadata. JEV proposals are not exposed here.
          minProperties: 1
          additionalProperties: false
          properties:
            tacticalStyle: { type: string, enum: [pressure, counter, balanced] }
            tempo: { type: string, enum: [patient, balanced, aggressive] }
            gripStyle: { type: string, enum: [dominant, adaptive, defensive, mixed] }
            newazaEmphasis: { type: string, enum: [low, medium, high] }
            standingPreference: { type: string, enum: [ashi_waza, te_waza, koshi_waza, ma_sutemi_waza, yoko_sutemi_waza, mixed] }
        lastUpdated: { type: string, format: date-time }
        profileUrl: { type: string, format: uri }
        bio: { type: string, minLength: 20 }
        gender: { type: string, enum: [male, female] }
        isHidden: { type: boolean, description: Public records are false. Internal-only records are not returned by this public API contract. }
        rarity: { type: string, enum: [Common, Rare, Epic, Legendary] }
        sourceUrls: { type: array, items: { type: string, format: uri } }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
    Source:
      type: object
      required: [url, claims, checkedAt]
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        publisher: { type: string }
        claims: { type: array, minItems: 1, items: { type: string, enum: [identity, nationality, weightClass, biography, competitionHistory] } }
        checkedAt: { type: string, format: date-time }
    Technique:
      type: object
      required: [id, name, japanese, style, category, subCategory, description, link]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1 }
        japanese: { type: string, minLength: 1 }
        style: { const: Judo }
        category: { type: string, enum: [Nage-waza, Katame-waza] }
        subCategory: { type: string, enum: [Te-waza, Koshi-waza, Ashi-waza, Ma-sutemi-waza, Yoko-sutemi-waza, Osaekomi-waza, Shime-waza, Kansetsu-waza] }
        description: { type: string, minLength: 3 }
        link: { type: string, format: uri }
    EventEffect:
      type: object
      required: [action, target, value]
      additionalProperties: false
      properties:
        action: { type: string, enum: [modify, set] }
        target: { type: string, enum: [power, speed, technique, kumikata, newaza, shido, waza_ari, score, match_result] }
        value: { oneOf: [ { type: integer }, { type: string } ] }
    Event:
      type: object
      required: [id, ruleset, category, description, effects]
      additionalProperties: false
      properties:
        id: { type: string }
        ruleset: { type: string }
        category: { type: string }
        description: { type: string, minLength: 20 }
        effects: { type: array, minItems: 1, items: { $ref: '#/components/schemas/EventEffect' } }
    Country:
      type: object
      required: [country, code, lastUpdated, active]
      additionalProperties: false
      properties:
        country: { type: string, minLength: 1 }
        code: { type: string, pattern: '^[A-Z]{2}$' }
        lastUpdated: { type: string, format: date-time }
        active: { type: boolean }
    WeightCategory:
      type: object
      required: [gender, description, categories]
      additionalProperties: false
      properties:
        gender: { type: string, enum: [male, female] }
        description: { type: string, minLength: 1 }
        categories:
          type: array
          minItems: 1
          items:
            type: object
            required: [weight, descriptor]
            additionalProperties: false
            properties:
              weight: { type: string, pattern: '^[+-][0-9]{2,3}$' }
              descriptor: { type: string, minLength: 1 }
    Version:
      type: object
      required: [datasetVersion, serviceVersion, sourceGitCommit, datasetChecksum, drawAlgorithms, defaultDrawAlgorithm]
      properties:
        datasetVersion: { type: string }
        serviceVersion: { type: string }
        sourceGitCommit: { type: string, pattern: '^[0-9a-f]{40}$' }
        datasetChecksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        drawAlgorithms: { type: array, items: { type: string } }
        defaultDrawAlgorithm: { type: string }
    Status:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required: [status]
          properties:
            status: { const: ok }
    Coverage:
      type: object
      required: [total, publicReal, hidden, byGender, byCountry, byWeightClass, byRarity, rarityPercentages]
      properties:
        total: { type: integer }
        publicReal: { type: integer }
        hidden: { type: integer, deprecated: true, description: This all-record count is deprecated. Use /v1/coverage/public. }
        byGender: { type: object, additionalProperties: { type: integer } }
        byCountry: { type: object, additionalProperties: { type: integer } }
        byWeightClass: { type: object, additionalProperties: { type: integer } }
        byRarity: { type: object, additionalProperties: { type: integer } }
        rarityPercentages: { type: object, additionalProperties: { type: number } }
    PublicCoverage:
      type: object
      required: [publicReal, byGender, byCountry, byWeightClass, byRarity, rarityPercentages]
      additionalProperties: false
      properties:
        publicReal: { type: integer, description: Number of visible real judoka included in the distributions. }
        byGender: { type: object, additionalProperties: { type: integer } }
        byCountry: { type: object, additionalProperties: { type: integer } }
        byWeightClass: { type: object, additionalProperties: { type: integer } }
        byRarity: { type: object, additionalProperties: { type: integer } }
        rarityPercentages: { type: object, additionalProperties: { type: number } }
    JudokaPage:
      type: object
      required: [judoka]
      properties:
        judoka: { type: array, items: { $ref: '#/components/schemas/Judoka' } }
        nextCursor: { type: string }
    TechniquePage:
      type: object
      required: [techniques]
      properties:
        techniques: { type: array, items: { $ref: '#/components/schemas/Technique' } }
        nextCursor: { type: string }
    EventPage:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        nextCursor: { type: string }
    JudokaDraw:
      type: object
      required: [datasetVersion, algorithm, poolSize, judoka]
      properties:
        datasetVersion: { type: string }
        algorithm: { type: string }
        seed: { type: string }
        poolSize: { type: integer }
        judoka: { type: array, items: { $ref: '#/components/schemas/Judoka' } }
    EventDraw:
      type: object
      required: [datasetVersion, algorithm, poolSize, event]
      properties:
        datasetVersion: { type: string }
        algorithm: { type: string }
        seed: { type: string }
        poolSize: { type: integer }
        event: { $ref: '#/components/schemas/Event' }
  headers:
    ETag: { schema: { type: string }, description: Entity tag for the current public representation. }
    CacheControl: { schema: { type: string }, description: Public caching policy. }
    Deprecation: { schema: { type: string }, description: Deprecation marker for the legacy coverage operation. }
    Sunset: { schema: { type: string }, description: Planned removal date in HTTP-date form. }
    SuccessorLink: { schema: { type: string }, description: Link to the replacement public coverage operation. }
  responses:
    Judoka: { description: Public judoka record, headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Judoka' } } } }
    JudokaList: { description: Judoka array, or a named cursor page when limit is supplied, headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { oneOf: [ { type: array, items: { $ref: '#/components/schemas/Judoka' } }, { $ref: '#/components/schemas/JudokaPage' } ] } } } }
    Technique: { description: Canonical technique, headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Technique' } } } }
    TechniqueList: { description: Technique array, or a named cursor page when limit is supplied, headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { oneOf: [ { type: array, items: { $ref: '#/components/schemas/Technique' } }, { $ref: '#/components/schemas/TechniquePage' } ] } } } }
    Event: { description: Ruleset-scoped gameplay event, headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
    EventList: { description: Event array, or a named cursor page when limit is supplied, headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { oneOf: [ { type: array, items: { $ref: '#/components/schemas/Event' } }, { $ref: '#/components/schemas/EventPage' } ] } } } }
    EventDraw: { description: Event draw result, content: { application/json: { schema: { $ref: '#/components/schemas/EventDraw' } } } }
